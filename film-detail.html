<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Project - Personal Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="film-detail.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo"></a>
            <ul class="nav-menu">
                <li><a href="projects.html" class="nav-link active">(PROJECT)</a></li>
                <li><a href="about.html" class="nav-link">(ABOUT)</a></li>
            </ul>
        </div>
    </nav>

    <!-- Project Detail Section -->
    <section class="film-detail-section">
        <div class="film-detail-container">
            <!-- Left: Carousel with Thumbnails -->
            <div class="film-carousel">
                <button class="carousel-arrow carousel-prev">‹</button>
                <div class="carousel-main">
                    <div class="carousel-placeholder"></div>
                </div>
                <button class="carousel-arrow carousel-next">›</button>

                <!-- Thumbnails -->
                <div class="carousel-thumbnails">
                    <div class="thumbnail-item active"></div>
                    <div class="thumbnail-item"></div>
                    <div class="thumbnail-item"></div>
                    <div class="thumbnail-item"></div>
                    <div class="thumbnail-item"></div>
                </div>
            </div>

            <!-- Right: Project Info -->
            <div class="film-info">
                <div class="film-meta">
                    <p class="project-number">001</p>
                    <h1 class="project-title">SOMETHING SOMETHING M/V</h1>
                    <a href="#" class="project-show-link">SHOW M/V</a>
                </div>

                <div class="film-credits">
                    <p>Artist: SOMEONE</p>
                    <p>Director: CHARLIE S TANG</p>
                    <p>Role: PRODUCTION</p>
                </div>

                <div class="film-term">
                    <p>TERM 1 PROJECT 2</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Film carousel functionality
        let currentSlide = 0;
        const totalSlides = 5;

        const prevButton = document.querySelector('.carousel-prev');
        const nextButton = document.querySelector('.carousel-next');
        const thumbnails = document.querySelectorAll('.thumbnail-item');

        function updateCarousel(index) {
            currentSlide = index;

            // Update thumbnail active states
            thumbnails.forEach((thumb, i) => {
                thumb.classList.toggle('active', i === currentSlide);
            });

            // Here you would update the main image
            // For now it just updates the active thumbnail
        }

        prevButton.addEventListener('click', () => {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel(currentSlide);
        });

        nextButton.addEventListener('click', () => {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel(currentSlide);
        });

        // Thumbnail click handlers
        thumbnails.forEach((thumb, index) => {
            thumb.addEventListener('click', () => {
                updateCarousel(index);
            });
        });
    </script>
</body>
</html>
